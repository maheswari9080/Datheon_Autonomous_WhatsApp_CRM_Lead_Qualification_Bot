<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 36px; fill: #0f172a; }
      .text-subhead { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #475569; }
      .text-card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .text-card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
      .card-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 14; }
      .metric-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 10; }
    </style>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow-1" cx="85%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" class="bg"/>
  <rect width="1200" height="675" fill="url(#glow-1)"/>
  <rect width="1200" height="675" fill="url(#glow-2)"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Navigation Pill -->
  <g transform="translate(60, 48)">
    <rect width="320" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#2563eb"/>
    <text x="34" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#1d4ed8" letter-spacing="0.5">OPEN-SOURCE LAUNCH | AGENTIC AI</text>

    <g transform="translate(850, 0)">
      <rect width="230" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="20" cy="17" r="5" fill="#10b981"/>
      <text x="34" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#065f46">39/39 PYTEST TESTS (100%)</text>
    </g>
  </g>

  <!-- Header Title -->
  <text x="60" y="135" class="text-title">Datheon Autonomous WhatsApp CRM &amp; Lead Qualification Bot</text>
  <text x="60" y="168" class="text-subhead">Production-grade conversational AI turning incoming WhatsApp leads into scored CRM pipelines and booked meetings.</text>

  <!-- 4 Bento Feature Cards -->
  <g transform="translate(60, 205)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="255" height="210" class="card-box"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#ecfdf5"/>
    <text x="32" y="46" font-size="20">🛡️</text>
    <text x="20" y="90" class="text-card-title">Ingestion &amp; Security</text>
    <text x="20" y="115" class="text-card-body">HMAC-SHA256 signature verification,</text>
    <text x="20" y="133" class="text-card-body">distributed idempotency locking,</text>
    <text x="20" y="151" class="text-card-body">ReDoS &amp; prompt injection defenses.</text>
    <rect x="20" y="172" width="115" height="20" rx="5" fill="#e2e8f0"/>
    <text x="28" y="186" font-size="10" font-weight="600" fill="#334155" font-family="sans-serif">STRIDE HARDENED</text>

    <!-- Card 2 -->
    <rect x="275" y="0" width="255" height="210" class="card-box"/>
    <rect x="295" y="20" width="40" height="40" rx="10" fill="#eff6ff"/>
    <text x="307" y="46" font-size="20">🧠</text>
    <text x="295" y="90" class="text-card-title">BANT Qualification &amp; FSM</text>
    <text x="295" y="115" class="text-card-body">Extracts budget, authority, need, and</text>
    <text x="295" y="133" class="text-card-body">timeline into validated Pydantic models</text>
    <text x="295" y="151" class="text-card-body">with deterministic state transitions.</text>
    <rect x="295" y="172" width="110" height="20" rx="5" fill="#dbeafe"/>
    <text x="303" y="186" font-size="10" font-weight="600" fill="#1e40af" font-family="sans-serif">SCORE: 94/100 QUAL</text>

    <!-- Card 3 -->
    <rect x="550" y="0" width="255" height="210" class="card-box"/>
    <rect x="570" y="20" width="40" height="40" rx="10" fill="#fef3c7"/>
    <text x="582" y="46" font-size="20">📅</text>
    <text x="570" y="90" class="text-card-title">Autonomous Scheduling</text>
    <text x="570" y="115" class="text-card-body">Zero-collision slot reservations via</text>
    <text x="570" y="133" class="text-card-body">Google Calendar &amp; Cal.com with</text>
    <text x="570" y="151" class="text-card-body">instant attendee notifications.</text>
    <rect x="570" y="172" width="115" height="20" rx="5" fill="#fef3c7"/>
    <text x="578" y="186" font-size="10" font-weight="600" fill="#92400e" font-family="sans-serif">ZERO COLLISION</text>

    <!-- Card 4 -->
    <rect x="825" y="0" width="255" height="210" class="card-box"/>
    <rect x="845" y="20" width="40" height="40" rx="10" fill="#f3e8ff"/>
    <text x="857" y="46" font-size="20">⚡</text>
    <text x="845" y="90" class="text-card-title">Transactional Outbox</text>
    <text x="845" y="115" class="text-card-body">Guaranteed delivery to Airtable CRM</text>
    <text x="845" y="133" class="text-card-body">and Slack handoff with exponential</text>
    <text x="845" y="151" class="text-card-body">backoff and dead-letter queue (DLQ).</text>
    <rect x="845" y="172" width="115" height="20" rx="5" fill="#f3e8ff"/>
    <text x="853" y="186" font-size="10" font-weight="600" fill="#6b21a8" font-family="sans-serif">AT-LEAST-ONCE</text>
  </g>

  <!-- Metric Badges Strip -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="1080" height="85" class="metric-box"/>

    <g transform="translate(60, 22)">
      <text x="0" y="24" font-family="sans-serif" font-weight="800" font-size="22" fill="#059669">39 / 39</text>
      <text x="0" y="44" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="0.5">UNIT &amp; E2E TESTS (100%)</text>
    </g>

    <line x1="280" y1="18" x2="280" y2="67" stroke="#cbd5e1" stroke-width="1"/>

    <g transform="translate(340, 22)">
      <text x="0" y="24" font-family="sans-serif" font-weight="800" font-size="22" fill="#2563eb">FastAPI + Async</text>
      <text x="0" y="44" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="0.5">PYDANTIC V2 • SQLALCHEMY</text>
    </g>

    <line x1="560" y1="18" x2="560" y2="67" stroke="#cbd5e1" stroke-width="1"/>

    <g transform="translate(620, 22)">
      <text x="0" y="24" font-family="sans-serif" font-weight="800" font-size="22" fill="#7c3aed">Zero-Downtime</text>
      <text x="0" y="44" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="0.5">TRANSACTIONAL OUTBOX PATTERN</text>
    </g>

    <line x1="840" y1="18" x2="840" y2="67" stroke="#cbd5e1" stroke-width="1"/>

    <g transform="translate(900, 22)">
      <text x="0" y="24" font-family="sans-serif" font-weight="800" font-size="22" fill="#0f172a">Multi-Stage</text>
      <text x="0" y="44" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="0.5">NON-ROOT DOCKER IMAGE</text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(60, 560)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="40" font-family="sans-serif" font-weight="600" font-size="14" fill="#0f172a">👤 Project by Maheswari • Open Source Release under MIT License</text>
    <text x="680" y="40" font-family="sans-serif" font-weight="600" font-size="14" fill="#2563eb">github.com/maheswari9080/Datheon_Autonomous_WhatsApp_CRM_Lead_Qualification_Bot</text>
  </g>
</svg>
